[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codocs"
dynamic = ["version"]
description = "Executably verified docs, unit tests and repository wikis for Go, Python, Java, C, C++ and COBOL: docs are scored by regenerating the code from them and running the tests (SpecForge), tests by coverage x mutation score (TeSearch)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "Yutong (CiCi) Cheng" }]
keywords = [
    "llm", "agents", "documentation", "documentation-generation", "unit-test-generation",
    "test-generation", "mutation-testing", "code-coverage", "cobol", "legacy-code",
    "mainframe", "golang", "java", "code-wiki", "deepwiki", "software-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Java",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "scipy>=1.10",  # networkx pagerank (wiki package ranking)
    "tree-sitter>=0.23",  # Python, Java, C and C++ parsing
    "tree-sitter-language-pack>=0.7",
    "pytest>=7.0",  # codocs runs the analysed repository's Python tests with coverage
    "coverage>=7.0",
    "tomli>=1.1; python_version < '3.11'",  # pyproject parsing of analysed Python repos
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]
lint = ["ruff>=0.6", "pre-commit>=3.5"]
dev = ["codocs[test,lint]"]

[project.urls]
Homepage = "https://github.com/ccsnow127/CoDoc"
Repository = "https://github.com/ccsnow127/CoDoc"
Documentation = "https://github.com/ccsnow127/CoDoc/blob/main/docs/index.md"
Issues = "https://github.com/ccsnow127/CoDoc/issues"
Changelog = "https://github.com/ccsnow127/CoDoc/blob/main/CHANGELOG.md"
Blog = "https://ccsnow127.github.io/blog/2026/codoc/"
"Paper (SpecForge)" = "https://arxiv.org/abs/2610.15708"
"Paper (TeSearch)" = "https://arxiv.org/abs/2610.15964"

[project.scripts]
codocs = "codocs.cli:cli"

[tool.hatch.version]
path = "src/codocs/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/codocs"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.DS_Store"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/datasets", "/docs", "/README.md", "/LICENSE",
    "/THIRD_PARTY_NOTICES.md", "/CHANGELOG.md", "/CITATION.cff", "/environment.yml",
    "/install.sh", "/.env.example", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md", "/SECURITY.md",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/.DS_Store"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# fixture repositories are test data; their import grouping follows their own layout
"tests/fixtures/**" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
