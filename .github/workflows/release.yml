name: Release

on:
  release:
    types: [published]     # publish to PyPI from a published GitHub release
  workflow_dispatch:       # manual run: publish to TestPyPI

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: twine check
        run: twine check --strict dist/*
      - name: Tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          v=$(python -c "import re, pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/codocs/__init__.py').read_text())[1])")
          if [ "v$v" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package version $v"
            exit 1
          fi
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheelvenv
          /tmp/wheelvenv/bin/python -m pip install dist/*.whl
          /tmp/wheelvenv/bin/codocs --version
          /tmp/wheelvenv/bin/codocs --help
          /tmp/wheelvenv/bin/python -c "import importlib.resources as r; assert (r.files('codocs') / 'prompts' / 'lang' / 'cobol.txt').is_file()"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ccsnow127/CoDoc'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/codocs
    permissions:
      id-token: write      # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    if: github.event_name == 'release' && github.repository == 'ccsnow127/CoDoc'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/codocs
    permissions:
      id-token: write      # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
